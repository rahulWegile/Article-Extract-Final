server {
    listen 80;
    server_name _;

    # 20-page broadsheet PDFs at newspaper scan resolution comfortably
    # clear 100-200MB; keep this above backend/core/config.py's own
    # MAX_UPLOAD_SIZE_MB (200 by default) so Nginx is never the thing
    # that rejects a large-but-otherwise-valid upload.
    client_max_body_size 250M;

    root /usr/share/nginx/html;
    index index.html;

    # Reserved for future endpoints served under /api/. The app's
    # CURRENT routes are not mounted under /api/ (see the block
    # below) -- this is here to satisfy that convention going
    # forward without another Nginx redeploy.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app's actual routes today (backend/main.py mounts these at
    # root, not under /api/): /upload + /upload/status/{job_id}
    # (backend/routes/upload.py), /search/* (backend/routes/
    # articles.py), /documents/* (backend/routes/documents.py,
    # StaticFiles mount), /output/* (article crops + JSON,
    # StaticFiles mount), and /health.
    location ~ ^/(upload|search|documents|output|health)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large PDF uploads / article-batch LLM calls can legitimately
        # take minutes (see OPENAI_TIMEOUT_SECONDS/GEMINI_TIMEOUT_SECONDS
        # in .env.example) -- do not let Nginx time the request out
        # before the backend itself does.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router (BrowserRouter) single-page app -- any path that
    # doesn't match a static asset or one of the API rules above falls
    # back to index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
